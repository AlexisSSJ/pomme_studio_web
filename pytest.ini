[pytest]
# Root configuration so tests can be run either from the repository root
# (`pytest`) or from the backend directory
# (`cd backend && pytest ../tests/backend/test_health.py -v`).
testpaths = tests
pythonpath = .

# Async tests are opt-in by function: mark them with @pytest.mark.asyncio
# (pytest-asyncio is configured explicitly to avoid implicit-mode surprises).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
