[pytest]
# Fallback for running `pytest` from the backend directory. The repository-root
# `pytest.ini` stays authoritative when a path is passed explicitly (e.g.
# `pytest ../tests/backend/test_health.py -v`) or when running from the root.
testpaths = ../tests
pythonpath = ..
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
