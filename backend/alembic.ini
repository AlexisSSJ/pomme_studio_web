# ---------------------------------------------------------------------------
# Alembic configuration — minimal scaffold for future migrations.
# ---------------------------------------------------------------------------
# Run from the backend directory:
#   cd backend && alembic revision --autogenerate -m "message"
#   cd backend && alembic upgrade head
#
# `alembic/env.py` (async engine wired to app.core.config / app.db.base) is
# added together with the first migration. Until then this file only carries
# the settings Alembic needs to locate the migration scripts.
# ---------------------------------------------------------------------------

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# Development fallback only. The real URL is injected from application
# settings once `alembic/env.py` exists; override with `-x`/`sqlalchemy.url`
# for one-off commands.
sqlalchemy.url = postgresql+asyncpg://pomme_user:pomme_password@localhost:5432/pomme_studio

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
